version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: catpen_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: catpen
      POSTGRES_PASSWORD: catpen_secret
      POSTGRES_DB: catatan_pengeluaran
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catpen"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: catpen_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://catpen:catpen_secret@db:5432/catatan_pengeluaran
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Mount DIREKTORI, bukan file tunggal. Bind-mount file yang belum ada
      # membuat Docker otomatis membuat direktori kosong bernama sama,
      # sehingga gspread gagal membaca credential tanpa pesan yang jelas.
      - ./secrets:/app/secrets:ro
      - app_logs:/app/logs

volumes:
  postgres_data:
  app_logs:
